[package]
name = "kiosk-naplata"
version = "1.0.7"
description = "Kiosk za naplatu ulaznica - Muzej Mileve Maric"
authors = ["Milos"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kiosk_naplata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# hardware
serialport = "4.5"
rusb = "0.9"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# ticket token (offline-verifiable QR)
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
qrcode = "0.14"

chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1", features = ["time"] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"

[features]
# When a device is absent (dev on macOS), the simulator feeds fake NV9 events.
simulate = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
